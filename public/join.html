<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Join Quiz</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --accent: #fbbf24;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body {
      min-height: 100dvh;
      background: var(--bg-dark);
      color: var(--text-main);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }

    .container { width: 100%; max-width: 480px; }
    .screen { display: none; animation: fadeIn 0.3s ease-out; }
    .screen.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

    .logo { text-align: center; margin-bottom: 2rem; }
    .logo h1 { font-size: 2.5rem; font-weight: 800; color: var(--accent); }
    .logo p { color: var(--text-muted); margin-top: 0.5rem; }

    .input-group { margin-bottom: 1.5rem; }
    .input-group label { display: block; margin-bottom: 0.5rem; color: var(--accent); font-weight: 600; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .input-group input {
      width: 100%; padding: 16px; font-size: 1.2rem; border: 2px solid rgba(255,255,255,0.1);
      border-radius: 12px; background: var(--bg-card); color: var(--text-main); text-align: center;
      transition: border-color 0.2s;
    }
    .input-group input:focus { outline: none; border-color: var(--accent); }
    .input-group input.name-input { text-align: left; text-transform: none; letter-spacing: normal; }

    .btn {
      width: 100%; padding: 18px; font-size: 1.2rem; font-weight: 700; color: #0f172a;
      background: var(--accent); border: none; border-radius: 12px;
      cursor: pointer; transition: transform 0.1s, background 0.2s;
      touch-action: manipulation;
    }
    .btn:active { transform: scale(0.97); background: var(--accent-hover); }

    .waiting { text-align: center; padding: 3rem 1rem; }
    .waiting-icon { font-size: 4rem; animation: bounce 2s infinite; }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

    .question-card { background: var(--bg-card); border-radius: 16px; padding: 1.5rem; }
    .category-badge { text-align: center; color: var(--accent); font-weight: 700; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 1rem; }
    .timer { text-align: center; font-size: 3rem; font-weight: 800; color: var(--accent); margin-bottom: 1rem; }
    .question-text { text-align: center; font-size: 1.3rem; font-weight: 600; line-height: 1.4; margin-bottom: 1.5rem; }

    .options { display: grid; gap: 12px; }
    .option {
      padding: 18px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1);
      border-radius: 12px; font-size: 1.1rem; font-weight: 600; text-align: center;
      cursor: pointer; transition: all 0.2s; touch-action: manipulation;
    }
    .option:active:not(:disabled) { transform: scale(0.98); background: rgba(251, 191, 36, 0.15); }
    .option.correct { background: rgba(34, 197, 94, 0.2); border-color: var(--success); color: var(--success); }
    .option.wrong { background: rgba(239, 68, 68, 0.2); border-color: var(--danger); color: var(--danger); }
    .option:disabled { cursor: default; opacity: 0.7; }

    .feedback { text-align: center; padding: 1rem; margin-top: 1.5rem; border-radius: 12px; font-size: 1.2rem; font-weight: 700; }
    .feedback.correct { background: rgba(34, 197, 94, 0.15); color: var(--success); }
    .feedback.wrong { background: rgba(239, 68, 68, 0.15); color: var(--danger); }

    .results-card { text-align: center; padding: 2rem 1rem; }
    .final-rank { font-size: 5rem; margin-bottom: 1rem; }
    .final-score { font-size: 2.5rem; color: var(--accent); font-weight: 800; margin-bottom: 0.5rem; }
    
    .error-msg { background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger); color: var(--danger); padding: 12px; border-radius: 8px; margin-bottom: 1rem; text-align: center; font-weight: 600; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div id="joinScreen" class="screen active">
      <div class="logo">
        <h1>🎮 Join Quiz</h1>
        <p>Enter the room code to play</p>
      </div>
      <div id="errorMsg" class="error-msg"></div>
      <div class="input-group">
        <label>Room Code</label>
        <input type="text" id="roomCodeInput" placeholder="ABC123" maxlength="6">
      </div>
      <div class="input-group">
        <label>Your Name</label>
        <input type="text" id="playerNameInput" class="name-input" placeholder="Enter your name">
      </div>
      <button class="btn" onclick="joinGame()">Join Game</button>
    </div>
    
    <div id="waitingScreen" class="screen">
      <div class="waiting">
        <div class="waiting-icon">🎉</div>
        <h2 style="margin: 1.5rem 0;">You're in!</h2>
        <p style="color: var(--text-muted);">The game will start soon. Good luck!</p>
      </div>
    </div>
    
    <div id="questionScreen" class="screen">
      <div class="question-card">
        <div class="category-badge" id="qCategory">Category</div>
        <div class="timer" id="timer">15</div>
        <div class="question-text" id="qText">Question?</div>
        <div class="options" id="options"></div>
        <div id="feedback" class="feedback" style="display: none;"></div>
      </div>
    </div>
    
    <div id="roundResultsScreen" class="screen">
      <div class="results-card">
        <h2 style="color: var(--text-muted); margin-bottom: 1rem;">Round Results</h2>
        <div id="roundRank" style="font-size: 4rem; margin: 1rem 0;">🏆</div>
        <div class="final-score"><span id="roundScore">0</span> pts</div>
        <p style="color: var(--accent); margin-top: 1.5rem; font-weight: 600;">Waiting for next question...</p>
      </div>
    </div>

    <div id="finalResultsScreen" class="screen">
      <div class="results-card">
        <div class="final-rank" id="finalRank">🏆</div>
        <h1 style="margin-bottom: 1rem;">Game Over!</h1>
        <div class="final-score"><span id="finalScore">0</span> points</div>
        <p id="rankText" style="color: var(--text-muted); margin-bottom: 2rem;"></p>
        <button class="btn" onclick="location.reload()">Play Again</button>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    let roomCode = null, playerId = null;
    
    const pathParts = window.location.pathname.split('/');
    if (pathParts[2]) document.getElementById('roomCodeInput').value = pathParts[2].toUpperCase();
    
    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg; el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', 3000);
    }
    
    async function joinGame() {
      const code = document.getElementById('roomCodeInput').value.toUpperCase().trim();
      const name = document.getElementById('playerNameInput').value.trim();
      if (!code || code.length !== 6) return showError('Enter a valid 6-character code');
      if (!name) return showError('Please enter your name');
      
      try {
        const res = await fetch(`/api/room/${code}`);
        if (!res.ok) return showError('Room not found');
        roomCode = code;
        socket.emit('join-game', { roomCode, playerName: name });
      } catch (e) { showError('Connection error'); }
    }
    
    socket.on('joined-success', (data) => {
      playerId = data.playerId;
      document.getElementById('joinScreen').classList.remove('active');
      document.getElementById('waitingScreen').classList.add('active');
    });
    socket.on('error', showError);
    
    socket.on('game-started', () => {
      document.getElementById('waitingScreen').classList.remove('active');
      document.getElementById('questionScreen').classList.add('active');
    });
    
    socket.on('new-question', (data) => {
      document.getElementById('qCategory').textContent = data.category;
      document.getElementById('qText').textContent = data.question;
      document.getElementById('timer').textContent = data.time;
      document.getElementById('feedback').style.display = 'none';
      
      const optionsDiv = document.getElementById('options');
      optionsDiv.innerHTML = '';
      data.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option';
        btn.textContent = `${String.fromCharCode(65 + i)}) ${opt}`;
        btn.onclick = () => submitAnswer(i);
        optionsDiv.appendChild(btn);
      });
      
      if (window.timerInterval) clearInterval(window.timerInterval);
      let timeLeft = data.time;
      window.timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').textContent = timeLeft;
        if (timeLeft <= 0) { clearInterval(window.timerInterval); disableOptions(); }
      }, 1000);
    });
    
    function submitAnswer(index) {
      if (!roomCode) return;
      disableOptions();
      if (navigator.vibrate) navigator.vibrate(50);
      socket.emit('submit-answer', { roomCode, answerIndex: index });
    }
    
    function disableOptions() {
      clearInterval(window.timerInterval);
      document.querySelectorAll('.option').forEach(btn => btn.disabled = true);
    }
    
    socket.on('answer-submitted', (data) => {
      const fb = document.getElementById('feedback');
      fb.style.display = 'block';
      if (data.correct) {
        fb.className = 'feedback correct';
        fb.textContent = `✅ Correct! +${data.points} pts`;
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
      } else {
        fb.className = 'feedback wrong';
        fb.textContent = '❌ Wrong answer';
        if (navigator.vibrate) navigator.vibrate(200);
      }
    });

    socket.on('round-results', (data) => {
      document.getElementById('questionScreen').classList.remove('active');
      document.getElementById('roundResultsScreen').classList.add('active');
      const player = data.leaderboard.find(p => p.id === playerId);
      const rank = data.leaderboard.findIndex(p => p.id === playerId) + 1;
      document.getElementById('roundScore').textContent = player ? player.score : 0;
      document.getElementById('roundRank').textContent = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : `#${rank}`;
    });

    socket.on('new-question', () => {
      document.getElementById('roundResultsScreen').classList.remove('active');
      document.getElementById('questionScreen').classList.add('active');
    });

    socket.on('game-over', (data) => {
      clearInterval(window.timerInterval);
      document.getElementById('questionScreen').classList.remove('active');
      document.getElementById('roundResultsScreen').classList.remove('active');
      document.getElementById('finalResultsScreen').classList.add('active');
      
      const player = data.leaderboard.find(p => p.id === playerId);
      const rank = data.leaderboard.findIndex(p => p.id === playerId) + 1;
      document.getElementById('finalScore').textContent = player ? player.score : 0;
      document.getElementById('finalRank').textContent = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : '🎮';
      document.getElementById('rankText').textContent = `You ranked #${rank} out of ${data.leaderboard.length} players!`;
    });
  </script>
</body>
</html>
