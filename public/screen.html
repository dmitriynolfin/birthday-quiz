<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Main Screen - Quiz</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --accent: #fbbf24;
      --accent-hover: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    body {
      min-height: 100dvh;
      background: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 4vw, 40px);
    }

    .screen { display: none; width: 100%; max-width: 1000px; text-align: center; animation: fadeIn 0.4s ease-out; }
    .screen.active { display: flex; flex-direction: column; align-items: center; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Typography */
    .title-xl { font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 800; color: var(--accent); margin-bottom: 1rem; }
    .title-lg { font-size: clamp(1.5rem, 4vw, 2.5rem); font-weight: 700; margin-bottom: 1.5rem; }
    .text-muted { color: var(--text-muted); font-size: clamp(1rem, 2vw, 1.25rem); }

    /* Video Container - Clean & Responsive */
    .video-wrapper {
      width: 100%;
      max-width: 800px;
      margin-bottom: 2rem;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 */
      height: 0;
    }
    .video-container iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }

    /* Question & Options */
    .category-badge {
      display: inline-block;
      background: rgba(251, 191, 36, 0.15);
      color: var(--accent);
      padding: 8px 20px;
      border-radius: 50px;
      font-weight: 700;
      font-size: clamp(0.9rem, 1.5vw, 1.1rem);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 1.5rem;
    }
    .question-text {
      font-size: clamp(1.5rem, 3.5vw, 2.5rem);
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 2.5rem;
      max-width: 900px;
    }
    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      width: 100%;
      max-width: 900px;
    }
    .option-box {
      background: var(--bg-card);
      border: 2px solid transparent;
      border-radius: 12px;
      padding: clamp(1rem, 2vw, 1.5rem);
      font-size: clamp(1.1rem, 1.8vw, 1.4rem);
      font-weight: 600;
      display: flex;
      align-items: center;
      transition: transform 0.2s, border-color 0.2s;
    }
    .option-box:nth-child(1) { border-left: 6px solid var(--danger); }
    .option-box:nth-child(2) { border-left: 6px solid #3b82f6; }
    .option-box:nth-child(3) { border-left: 6px solid var(--accent); }
    .option-box:nth-child(4) { border-left: 6px solid var(--success); }
    
    .option-letter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px; height: 36px;
      border-radius: 8px;
      background: rgba(255,255,255,0.1);
      margin-right: 1rem;
      font-weight: 800;
      flex-shrink: 0;
    }

    /* Timer */
    .timer-badge {
      position: fixed;
      top: 24px; right: 24px;
      background: var(--bg-card);
      border: 2px solid var(--accent);
      color: var(--accent);
      width: 80px; height: 80px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; font-weight: 800;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      z-index: 50;
    }
    .timer-badge.warning {
      border-color: var(--danger);
      color: var(--danger);
      animation: pulse 0.8s infinite;
    }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

    /* Stats & Leaderboard */
    .stats-bar-container { width: 100%; max-width: 700px; margin: 1.5rem 0; text-align: left; }
    .stats-label { display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-weight: 600; font-size: 1.1rem; }
    .stats-bar-bg { height: 32px; background: rgba(255,255,255,0.1); border-radius: 16px; overflow: hidden; }
    .stats-bar-fill { height: 100%; border-radius: 16px; transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); display: flex; align-items: center; padding-left: 16px; font-weight: 700; color: #0f172a; }
    
    .leaderboard-list { width: 100%; max-width: 700px; }
    .leader-item {
      background: var(--bg-card);
      margin: 0.75rem 0;
      padding: 1rem 1.5rem;
      border-radius: 12px;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 1.25rem; font-weight: 600;
      animation: slideUp 0.4s ease-out forwards; opacity: 0;
    }
    .leader-item:nth-child(1) { background: rgba(251, 191, 36, 0.15); border: 1px solid var(--accent); animation-delay: 0.1s; }
    .leader-item:nth-child(2) { animation-delay: 0.2s; }
    .leader-item:nth-child(3) { animation-delay: 0.3s; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    .sound-btn {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--bg-card); border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-muted); width: 48px; height: 48px;
      border-radius: 50%; cursor: pointer; font-size: 1.25rem;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; z-index: 50;
    }
    .sound-btn:hover { background: rgba(255,255,255,0.1); color: var(--text-main); }

    @media (max-width: 768px) {
      .options-grid { grid-template-columns: 1fr; }
      .timer-badge { width: 60px; height: 60px; font-size: 1.5rem; top: 16px; right: 16px; }
    }
  </style>
</head>
<body>
  <button class="sound-btn" onclick="toggleSound()" id="soundBtn">🔇</button>
  <div class="timer-badge" id="timer" style="display: none;">15</div>

  <div class="screen active" id="lobbyScreen">
    <div class="title-xl">🎂 Birthday Quiz</div>
    <div class="text-muted">Waiting for the host to start...</div>
    <div style="margin-top: 2rem; font-size: 1.5rem; color: var(--accent); font-weight: 700;">Room: <span id="displayRoomCode">---</span></div>
  </div>

  <div class="screen" id="questionScreen">
    <div class="video-wrapper" id="videoWrapper" style="display: none;">
      <div class="video-container">
        <iframe id="questionVideo" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
      </div>
    </div>
    <div class="category-badge" id="qCategory">Category</div>
    <div class="question-text" id="qText">Question goes here?</div>
    <div class="options-grid" id="optionsGrid"></div>
  </div>

  <div class="screen" id="statsScreen">
    <div class="title-lg">⏳ Time's Up!</div>
    <div id="statsContainer" style="width: 100%;"></div>
  </div>

  <div class="screen" id="roundResultsScreen">
    <div class="title-lg">📊 Round Results</div>
    <div class="leaderboard-list" id="roundLeaderboardMain"></div>
    <div class="text-muted" style="margin-top: 2rem;">Waiting for the next question...</div>
  </div>

  <div class="screen" id="finalResultsScreen">
    <div class="title-xl">🏆 Final Results</div>
    <div class="leaderboard-list" id="finalLeaderboardMain"></div>
  </div>

  <script>
    const socket = io();
    const roomCode = window.location.pathname.split('/')[2];
    document.getElementById('displayRoomCode').textContent = roomCode || 'Unknown';

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();
    let soundEnabled = false;

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('soundBtn').textContent = soundEnabled ? '🔊' : '🔇';
      if (soundEnabled && audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
      if (!soundEnabled) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;
      
      if (type === 'tick') {
        osc.frequency.setValueAtTime(800, now); gain.gain.setValueAtTime(0.1, now);
        osc.start(now); osc.stop(now + 0.05);
      } else if (type === 'fanfare') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.15);
        osc.frequency.setValueAtTime(783.99, now + 0.3);
        gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
        osc.start(now); osc.stop(now + 0.8);
      }
    }

    if (roomCode) socket.emit('join-game', { roomCode, playerName: '📺 Main Screen' });

    socket.on('game-started', () => {
      document.getElementById('lobbyScreen').classList.remove('active');
      playSound('fanfare');
    });

    socket.on('new-question', (data) => {
      document.getElementById('statsScreen').classList.remove('active');
      document.getElementById('roundResultsScreen').classList.remove('active');
      document.getElementById('questionScreen').classList.add('active');
      
      document.getElementById('qCategory').textContent = data.category;
      document.getElementById('qText').textContent = data.question;
      
      const videoWrapper = document.getElementById('videoWrapper');
      const questionVideo = document.getElementById('questionVideo');
      if (data.videoUrl) {
        videoWrapper.style.display = 'block';
        questionVideo.src = data.videoUrl.includes('?') ? data.videoUrl + '&autoplay=1&mute=1' : data.videoUrl + '?autoplay=1&mute=1';
      } else {
        videoWrapper.style.display = 'none';
        questionVideo.src = '';
      }
      
      const grid = document.getElementById('optionsGrid');
      grid.innerHTML = '';
      const letters = ['A', 'B', 'C', 'D'];
      const colors = ['#ef4444', '#3b82f6', '#fbbf24', '#22c55e'];
      
      data.options.forEach((opt, i) => {
        const div = document.createElement('div');
        div.className = 'option-box';
        div.innerHTML = `<span class="option-letter" style="color:${colors[i]}">${letters[i]}</span> ${opt}`;
        grid.appendChild(div);
      });

      const timerEl = document.getElementById('timer');
      timerEl.style.display = 'flex';
      timerEl.classList.remove('warning');
      let timeLeft = data.time;
      timerEl.textContent = timeLeft;
      
      if (window.timerInterval) clearInterval(window.timerInterval);
      window.timerInterval = setInterval(() => {
        timeLeft--;
        timerEl.textContent = timeLeft;
        if (timeLeft <= 5) { timerEl.classList.add('warning'); playSound('tick'); }
        if (timeLeft <= 0) { clearInterval(window.timerInterval); timerEl.style.display = 'none'; }
      }, 1000);
    });

    socket.on('answer-stats', (data) => {
      document.getElementById('questionScreen').classList.remove('active');
      document.getElementById('statsScreen').classList.add('active');
      const pct = Math.round((data.totalAnswers / data.totalPlayers) * 100) || 0;
      const correctPct = Math.round((data.correctAnswers / data.totalPlayers) * 100) || 0;
      
      document.getElementById('statsContainer').innerHTML = `
        <div class="stats-bar-container">
          <div class="stats-label"><span>Answered</span> <span>${data.totalAnswers} / ${data.totalPlayers}</span></div>
          <div class="stats-bar-bg"><div class="stats-bar-fill" style="width: ${pct}%; background: var(--accent);">${pct}%</div></div>
        </div>
        <div class="stats-bar-container">
          <div class="stats-label"><span>Correct</span> <span>${data.correctAnswers}</span></div>
          <div class="stats-bar-bg"><div class="stats-bar-fill" style="width: ${correctPct}%; background: var(--success);">${correctPct}%</div></div>
        </div>
      `;
    });

    socket.on('round-results', (data) => {
      document.getElementById('statsScreen').classList.remove('active');
      document.getElementById('roundResultsScreen').classList.add('active');
      playSound('fanfare');
      document.getElementById('roundLeaderboardMain').innerHTML = data.leaderboard.slice(0, 5).map((p, i) => `
        <div class="leader-item">
          <div style="display:flex; align-items:center; gap:16px;">
            <span style="font-size:1.5rem;">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '#' + (i+1)}</span>
            <span>${p.avatar} ${p.name}</span>
          </div>
          <span style="color: var(--accent); font-weight: 800;">${p.score} pts</span>
        </div>
      `).join('');
    });

    socket.on('game-over', (data) => {
      document.getElementById('roundResultsScreen').classList.remove('active');
      document.getElementById('finalResultsScreen').classList.add('active');
      playSound('fanfare');
      document.getElementById('finalLeaderboardMain').innerHTML = data.leaderboard.map((p, i) => `
        <div class="leader-item">
          <div style="display:flex; align-items:center; gap:16px;">
            <span style="font-size:1.5rem;">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '#' + (i+1)}</span>
            <span>${p.avatar} ${p.name}</span>
          </div>
          <span style="color: var(--accent); font-weight: 800;">${p.score} pts</span>
        </div>
      `).join('');
    });
  </script>
</body>
</html>
