<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Main Screen - Birthday Quiz</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      min-height: 100dvh;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(10px, 3vw, 40px);
      overflow: hidden;
    }
    .screen { display: none; width: 100%; max-width: 1400px; text-align: center; animation: fadeIn 0.6s ease; }
    .screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }

    .lobby-title { font-size: clamp(2.5rem, 6vw, 5rem); color: #ffd700; margin-bottom: 20px; text-shadow: 0 4px 20px rgba(255, 215, 0, 0.3); }
    .lobby-text { font-size: clamp(1.2rem, 3vw, 2rem); color: #aaa; }

    .video-container {
      width: 100%;
      max-width: 900px;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 30px;
      border: 3px solid #ffd700;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    .video-container iframe { width: 100%; height: 100%; border: none; }

    .category { font-size: clamp(1.2rem, 2.5vw, 2rem); color: #ffd700; text-transform: uppercase; letter-spacing: 5px; margin-bottom: 20px; }
    .question-text { font-size: clamp(1.8rem, 4vw, 3.5rem); font-weight: 800; line-height: 1.2; margin-bottom: 40px; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }

    .timer {
      position: absolute; top: 40px; right: 60px;
      font-size: clamp(3rem, 5vw, 5rem); font-weight: 900; color: #fff;
      background: rgba(255, 215, 0, 0.15); width: clamp(100px, 12vw, 150px); height: clamp(100px, 12vw, 150px);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      border: 4px solid #ffd700; transition: all 0.3s;
    }
    .timer.warning { color: #f44336; border-color: #f44336; animation: pulse 0.8s infinite; background: rgba(244, 67, 54, 0.2); }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(15px, 2vw, 30px); width: 100%; }
    .option-box {
      background: rgba(255, 255, 255, 0.08); border: 3px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px; padding: clamp(15px, 2vw, 30px);
      font-size: clamp(1.2rem, 2vw, 1.8rem); font-weight: 700;
      display: flex; align-items: center; transition: all 0.3s;
    }
    .option-box:nth-child(1) { border-left: 12px solid #f44336; }
    .option-box:nth-child(2) { border-left: 12px solid #2196f3; }
    .option-box:nth-child(3) { border-left: 12px solid #ffeb3b; }
    .option-box:nth-child(4) { border-left: 12px solid #4caf50; }
    .option-letter { font-size: 1.5em; margin-right: 20px; opacity: 0.8; }

    .stats-title { font-size: clamp(2.5rem, 5vw, 4rem); color: #ffd700; margin-bottom: 40px; }
    .stats-bar-container { width: 100%; max-width: 900px; margin: 20px 0; text-align: left; }
    .stats-label { font-size: clamp(1.2rem, 2vw, 1.5rem); margin-bottom: 10px; display: flex; justify-content: space-between; }
    .stats-bar-bg { height: clamp(30px, 4vw, 50px); background: rgba(255, 255, 255, 0.1); border-radius: 25px; overflow: hidden; }
    .stats-bar-fill { height: 100%; border-radius: 25px; transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1); display: flex; align-items: center; padding-left: 20px; font-size: 1.2em; font-weight: bold; color: #1a1a2e; }

    .results-title { font-size: clamp(3rem, 6vw, 5rem); color: #ffd700; margin-bottom: 40px; }
    .leaderboard-main { width: 100%; max-width: 900px; }
    .leader-item {
      background: rgba(255, 255, 255, 0.08); margin: 15px 0; padding: clamp(15px, 2vw, 25px) clamp(20px, 3vw, 40px);
      border-radius: 15px; display: flex; justify-content: space-between; align-items: center;
      font-size: clamp(1.2rem, 2.5vw, 2rem); animation: slideUp 0.5s ease forwards; opacity: 0;
    }
    .leader-item:nth-child(1) { background: linear-gradient(90deg, rgba(255,215,0,0.25), rgba(255,215,0,0.05)); border: 2px solid #ffd700; animation-delay: 0.1s; }
    .leader-item:nth-child(2) { animation-delay: 0.3s; }
    .leader-item:nth-child(3) { animation-delay: 0.5s; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

    .sound-toggle {
      position: fixed; bottom: 30px; right: 30px; background: rgba(255,255,255,0.1);
      border: 2px solid #ffd700; color: #ffd700; padding: 15px; border-radius: 50%;
      cursor: pointer; font-size: 1.5rem; transition: all 0.3s;
    }
    .sound-toggle:hover { background: #ffd700; color: #000; }
  </style>
</head>
<body>
  <button class="sound-toggle" onclick="toggleSound()" id="soundBtn">🔇</button>
  <div class="timer" id="timer" style="display: none;">15</div>

  <div class="screen lobby-screen active" id="lobbyScreen">
    <div class="lobby-title">🎂 Birthday Quiz Night</div>
    <div class="lobby-text">Waiting for the host to start the game...</div>
    <div style="margin-top: 30px; font-size: clamp(1.5rem, 3vw, 2.5rem); color: #ffd700;">Room: <span id="displayRoomCode">---</span></div>
  </div>

  <div class="screen question-screen" id="questionScreen">
    <div class="video-container" id="videoContainer" style="display: none;">
      <iframe id="questionVideo" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
    <div class="category" id="qCategory">Category</div>
    <div class="question-text" id="qText">Question goes here?</div>
    <div class="options-grid" id="optionsGrid"></div>
  </div>

  <div class="screen stats-screen" id="statsScreen">
    <div class="stats-title">⏳ Time's Up!</div>
    <div id="statsContainer" style="width: 100%; max-width: 900px;"></div>
  </div>

  <div class="screen results-screen" id="roundResultsScreen">
    <div class="results-title">📊 Round Leaderboard</div>
    <div class="leaderboard-main" id="roundLeaderboardMain"></div>
    <p style="margin-top: 30px; color: #aaa; font-size: 1.5rem;">Host is preparing the next question...</p>
  </div>

  <div class="screen results-screen" id="finalResultsScreen">
    <div class="results-title">🏆 Final Leaderboard</div>
    <div class="leaderboard-main" id="finalLeaderboardMain"></div>
  </div>

  <script>
    const socket = io();
    const pathParts = window.location.pathname.split('/');
    const roomCode = pathParts[2];
    document.getElementById('displayRoomCode').textContent = roomCode || 'Unknown';

    // Web Audio API для звуковых эффектов (не требует внешних файлов)
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();
    let soundEnabled = false;

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('soundBtn').textContent = soundEnabled ? '🔊' : '🔇';
      if (soundEnabled && audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
      if (!soundEnabled) return;
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      const now = audioCtx.currentTime;
      if (type === 'tick') {
        osc.frequency.setValueAtTime(800, now);
        gainNode.gain.setValueAtTime(0.1, now);
        osc.start(now); osc.stop(now + 0.05);
      } else if (type === 'correct') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
        gainNode.gain.setValueAtTime(0.2, now);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.start(now); osc.stop(now + 0.4);
      } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        gainNode.gain.setValueAtTime(0.2, now);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
      } else if (type === 'fanfare') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.15);
        osc.frequency.setValueAtTime(783.99, now + 0.3);
        gainNode.gain.setValueAtTime(0.3, now);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
        osc.start(now); osc.stop(now + 0.8);
      }
    }

    if (roomCode) socket.emit('join-game', { roomCode, playerName: '📺 Main Screen' });

    socket.on('game-started', () => {
      document.getElementById('lobbyScreen').classList.remove('active');
      playSound('fanfare');
    });

    socket.on('new-question', (data) => {
      document.getElementById('statsScreen').classList.remove('active');
      document.getElementById('roundResultsScreen').classList.remove('active');
      document.getElementById('questionScreen').classList.add('active');
      
      document.getElementById('qCategory').textContent = data.category;
      document.getElementById('qText').textContent = data.question;
      
      // Видео
      const videoContainer = document.getElementById('videoContainer');
      const questionVideo = document.getElementById('questionVideo');
      if (data.videoUrl) {
        videoContainer.style.display = 'block';
        questionVideo.src = data.videoUrl;
      } else {
        videoContainer.style.display = 'none';
        questionVideo.src = '';
      }
      
      const grid = document.getElementById('optionsGrid');
      grid.innerHTML = '';
      const letters = ['A', 'B', 'C', 'D'];
      const colors = ['#f44336', '#2196f3', '#ffeb3b', '#4caf50'];
      
      data.options.forEach((opt, i) => {
        const div = document.createElement('div');
        div.className = 'option-box';
        div.innerHTML = `<span class="option-letter" style="color:${colors[i]}">${letters[i]}</span> ${opt}`;
        grid.appendChild(div);
      });

      const timerEl = document.getElementById('timer');
      timerEl.style.display = 'flex';
      timerEl.classList.remove('warning');
      let timeLeft = data.time;
      timerEl.textContent = timeLeft;
      
      if (window.timerInterval) clearInterval(window.timerInterval);
      window.timerInterval = setInterval(() => {
        timeLeft--;
        timerEl.textContent = timeLeft;
        if (timeLeft <= 5) {
          timerEl.classList.add('warning');
          playSound('tick');
        }
        if (timeLeft <= 0) {
          clearInterval(window.timerInterval);
          timerEl.style.display = 'none';
          playSound('wrong');
        }
      }, 1000);
    });

    socket.on('answer-stats', (data) => {
      document.getElementById('questionScreen').classList.remove('active');
      document.getElementById('statsScreen').classList.add('active');
      
      const container = document.getElementById('statsContainer');
      container.innerHTML = `
        <div class="stats-bar-container">
          <div class="stats-label"><span>Players Answered</span> <span>${data.totalAnswers} / ${data.totalPlayers}</span></div>
          <div class="stats-bar-bg">
            <div class="stats-bar-fill" style="width: ${(data.totalAnswers/data.totalPlayers)*100}%; background: #ffd700;">
              ${Math.round((data.totalAnswers/data.totalPlayers)*100)}%
            </div>
          </div>
        </div>
        <div class="stats-bar-container">
          <div class="stats-label"><span>Correct Answers</span> <span>${data.correctAnswers}</span></div>
          <div class="stats-bar-bg">
            <div class="stats-bar-fill" style="width: ${(data.correctAnswers/data.totalPlayers)*100}%; background: #4caf50;">
              ${data.correctAnswers}
            </div>
          </div>
        </div>
      `;
    });

    socket.on('round-results', (data) => {
      document.getElementById('statsScreen').classList.remove('active');
      document.getElementById('roundResultsScreen').classList.add('active');
      playSound('fanfare');
      
      const lb = document.getElementById('roundLeaderboardMain');
      lb.innerHTML = data.leaderboard.slice(0, 5).map((p, i) => `
        <div class="leader-item">
          <div style="display:flex; align-items:center; gap:20px;">
            <span style="font-size:1.5em;">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '#' + (i+1)}</span>
            <span>${p.avatar} ${p.name}</span>
          </div>
          <span style="color: #ffd700; font-weight: bold;">${p.score} pts</span>
        </div>
      `).join('');
    });

    socket.on('game-over', (data) => {
      document.getElementById('roundResultsScreen').classList.remove('active');
      document.getElementById('finalResultsScreen').classList.add('active');
      playSound('fanfare');
      
      const lb = document.getElementById('finalLeaderboardMain');
      lb.innerHTML = data.leaderboard.map((p, i) => `
        <div class="leader-item">
          <div style="display:flex; align-items:center; gap:20px;">
            <span style="font-size:1.5em;">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '#' + (i+1)}</span>
            <span>${p.avatar} ${p.name}</span>
          </div>
          <span style="color: #ffd700; font-weight: bold;">${p.score} pts</span>
        </div>
      `).join('');
    });
  </script>
</body>
</html>
