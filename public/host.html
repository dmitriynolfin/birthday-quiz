<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Host</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --accent: #fbbf24;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    body { min-height: 100dvh; background: var(--bg-dark); color: var(--text-main); padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    
    .header { text-align: center; margin-bottom: 2rem; }
    .header h1 { font-size: 2rem; font-weight: 800; color: var(--accent); }
    
    .room-info {
      background: var(--bg-card); border-radius: 16px; padding: 1.5rem;
      text-align: center; margin-bottom: 1.5rem;
    }
    .room-code { font-size: 2.5rem; font-weight: 800; color: var(--accent); letter-spacing: 8px; margin: 1rem 0; }
    .qr-section { background: #fff; padding: 15px; border-radius: 12px; display: inline-block; margin: 1rem 0; }
    .qr-section img { width: 180px; height: 180px; }
    
    .players-list { background: var(--bg-card); border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; }
    .players-list h2 { color: var(--accent); margin-bottom: 1rem; font-size: 1.2rem; }
    .player-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
    .player-card { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 10px; text-align: center; animation: fadeIn 0.3s; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .player-avatar { font-size: 2rem; margin-bottom: 8px; }
    .player-name { font-weight: 600; color: var(--text-main); font-size: 0.9rem; word-break: break-word; }
    
    .screen { background: var(--bg-card); border-radius: 16px; padding: 2rem; text-align: center; display: none; }
    .screen.active { display: block; animation: fadeIn 0.3s; }
    
    .category { color: var(--accent); font-size: 1rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 1rem; }
    .question-text { font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem; line-height: 1.3; }
    .timer { font-size: 3rem; color: var(--accent); font-weight: 800; margin: 1rem 0; }
    
    .btn {
      padding: 16px 32px; font-size: 1.1rem; font-weight: 700; color: #0f172a;
      background: var(--accent); border: none; border-radius: 12px;
      cursor: pointer; transition: all 0.2s; margin: 8px;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(251, 191, 36, 0.3); }
    .btn-secondary { background: rgba(255,255,255,0.1); color: var(--text-main); }
    
    .leaderboard-item {
      background: rgba(255,255,255,0.05); padding: 1rem; margin: 8px 0; border-radius: 10px;
      display: flex; align-items: center; justify-content: space-between; animation: slideIn 0.3s;
    }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
    .leaderboard-item:nth-child(1) { background: rgba(251, 191, 36, 0.15); border: 1px solid var(--accent); }
    .rank { font-size: 1.5rem; font-weight: 800; margin-right: 16px; }
    .player-score { font-size: 1.2rem; font-weight: 700; color: var(--accent); }

    .sticky-controls {
      position: sticky; bottom: 20px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      padding: 1rem; border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.1);
      display: flex; justify-content: center; gap: 12px;
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎮 Host Control Panel</h1>
    </div>
    
    <div class="room-info">
      <div style="color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;">Room Code</div>
      <div class="room-code" id="roomCode">Loading...</div>
      <div class="qr-section"><img id="qrCode" src="" alt="QR"></div>
      <br>
      <a id="screenLink" href="#" target="_blank" class="btn btn-secondary" style="text-decoration: none; display: inline-block; font-size: 0.9rem; padding: 12px 24px;">📺 Open Main Screen</a>
    </div>
    
    <div class="players-list">
      <h2>👥 Players (<span id="playerCount">0</span>)</h2>
      <div class="player-grid" id="playersGrid">
        <p style="color: var(--text-muted); grid-column: 1/-1;">Waiting for players...</p>
      </div>
    </div>
    
    <div class="screen active" id="lobbyScreen">
      <h2 style="margin-bottom: 1rem;">Ready to Start?</h2>
      <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Wait for players to join, then begin!</p>
      <button class="btn" onclick="startGame()">🚀 Start Game</button>
    </div>
    
    <div class="screen" id="questionScreen">
      <div class="category" id="qCategory">Category</div>
      <div class="question-text" id="qText">Question?</div>
      <div class="timer" id="timer">15</div>
    </div>
    
    <div class="screen" id="roundResultsScreen">
      <h2 style="margin-bottom: 1.5rem;">📊 Round Results</h2>
      <div id="roundLeaderboard" style="margin-bottom: 1.5rem;"></div>
    </div>
    
    <div class="screen" id="finalResultsScreen">
      <h1 style="margin-bottom: 1.5rem;">🏆 Final Results</h1>
      <div id="finalLeaderboard" style="margin-bottom: 1.5rem;"></div>
      <button class="btn" onclick="location.reload()">🔄 New Game</button>
    </div>

    <div class="sticky-controls" id="controls" style="display: none;">
      <button class="btn" id="showResultsBtn" onclick="showRoundResults()" style="display: none;">📊 Show Results</button>
      <button class="btn" id="nextBtn" onclick="nextQuestion()" style="display: none;">➡️ Next Question</button>
    </div>
  </div>

  <script>
    const socket = io();
    let roomCode = null;
    
    async function createRoom() {
      try {
        const res = await fetch('/api/create-room', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ hostName: 'Host' })
        });
        const data = await res.json();
        roomCode = data.roomCode;
        document.getElementById('roomCode').textContent = data.roomCode;
        document.getElementById('qrCode').src = data.qrCode;
        document.getElementById('screenLink').href = '/screen/' + data.roomCode;
        socket.emit('join-game', { roomCode: data.roomCode, playerName: 'Host' });
      } catch (e) { console.error(e); }
    }
    createRoom();
    
    socket.on('players-update', (data) => {
      document.getElementById('playerCount').textContent = data.playerCount;
      const grid = document.getElementById('playersGrid');
      if (data.players.length === 0) {
        grid.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1;">Waiting...</p>';
      } else {
        grid.innerHTML = data.players.map(p => `
          <div class="player-card">
            <div class="player-avatar">${p.avatar}</div>
            <div class="player-name">${p.name}</div>
          </div>
        `).join('');
      }
    });
    
    socket.on('game-started', () => {
      document.getElementById('lobbyScreen').classList.remove('active');
      document.getElementById('questionScreen').classList.add('active');
      document.getElementById('controls').style.display = 'flex';
    });
    
    socket.on('new-question', (data) => {
      document.getElementById('qCategory').textContent = data.category;
      document.getElementById('qText').textContent = data.question;
      document.getElementById('timer').textContent = data.time;
      document.getElementById('showResultsBtn').style.display = 'none';
      document.getElementById('nextBtn').style.display = 'none';
      
      let timeLeft = data.time;
      if (window.timerInterval) clearInterval(window.timerInterval);
      window.timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').textContent = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(window.timerInterval);
          document.getElementById('showResultsBtn').style.display = 'inline-block';
        }
      }, 1000);
    });
    
    socket.on('round-results', (data) => {
      document.getElementById('questionScreen').classList.remove('active');
      document.getElementById('roundResultsScreen').classList.add('active');
      document.getElementById('showResultsBtn').style.display = 'none';
      document.getElementById('nextBtn').style.display = 'inline-block';
      
      document.getElementById('roundLeaderboard').innerHTML = data.leaderboard.slice(0, 5).map((p, i) => `
        <div class="leaderboard-item">
          <div style="display: flex; align-items: center;">
            <div class="rank">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '#' + (i + 1)}</div>
            <div>
              <div style="font-size: 1.2rem; margin-bottom: 4px;">${p.avatar}</div>
              <div style="font-weight: 600;">${p.name}</div>
            </div>
          </div>
          <div class="player-score">${p.score} pts</div>
        </div>
      `).join('');
    });

    socket.on('game-over', (data) => {
      clearInterval(window.timerInterval);
      document.getElementById('roundResultsScreen').classList.remove('active');
      document.getElementById('finalResultsScreen').classList.add('active');
      document.getElementById('controls').style.display = 'none';
      
      document.getElementById('finalLeaderboard').innerHTML = data.leaderboard.map((p, i) => `
        <div class="leaderboard-item">
          <div style="display: flex; align-items: center;">
            <div class="rank">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '#' + (i + 1)}</div>
            <div>
              <div style="font-size: 1.2rem; margin-bottom: 4px;">${p.avatar}</div>
              <div style="font-weight: 600;">${p.name}</div>
            </div>
          </div>
          <div class="player-score">${p.score} pts</div>
        </div>
      `).join('');
    });
    
    function startGame() {
      if (!roomCode) return;
      socket.emit('start-game', roomCode);
    }
    
    function showRoundResults() {
      if (!roomCode) return;
      socket.emit('show-round-results', roomCode);
    }

    function nextQuestion() {
      if (!roomCode) return;
      socket.emit('next-question', roomCode);
    }
  </script>
</body>
</html>
